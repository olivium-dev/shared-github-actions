name: Jeeb ephemeral capability probe

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      
      shared_actions_sha:
        required: true
        type: string
      expected_job_workflow_ref:
        required: true
        type: string
      environment:
        required: true
        type: string
      zone:
        required: true
        type: string

permissions: {}

jobs:
  contract_gate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: olivium-dev/shared-github-actions
          ref: ${{ inputs.shared_actions_sha }}
          path: trusted
          persist-credentials: false
      - name: Validate capability contract
        env:
          SHARED_ACTIONS_SHA: ${{ inputs.shared_actions_sha }}
          EXPECTED_JOB_WORKFLOW_REF: ${{ inputs.expected_job_workflow_ref }}
          APPROVED_ZONE: ${{ inputs.zone }}
          PROTECTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          test "${{ inputs.operation }}" = capability
          test "$(git -C trusted rev-parse HEAD)" = "$SHARED_ACTIONS_SHA"
          python3 trusted/scripts/contracts.py validate-capability \
            --shared-actions-sha "$SHARED_ACTIONS_SHA" \
            --manager-url https://ephemeral.fds-8.space \
            --manager-audience https://ephemeral.fds-8.space/api/automation/v1 \
            --zone "$APPROVED_ZONE" \
            --environment "$PROTECTED_ENVIRONMENT" \
            --expected-job-workflow-ref "$EXPECTED_JOB_WORKFLOW_REF" \
            --output capability-contract
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capability-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: trusted/scripts
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capability-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: capability-contract
          if-no-files-found: error
          retention-days: 1

  manager_capability:
    needs: contract_gate
    runs-on: ubuntu-22.04
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: none
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: capability-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: capability-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: capability-contract
      - name: Call manager capability endpoint
        env:
          EXPECTED_JOB_WORKFLOW_REF: ${{ inputs.expected_job_workflow_ref }}
          EXPECTED_JOB_WORKFLOW_SHA: ${{ inputs.shared_actions_sha }}
          PROTECTED_ENVIRONMENT: ${{ inputs.environment }}
          APPROVED_ZONE: ${{ inputs.zone }}
        run: |
          set -euo pipefail
          python3 tools/manager_client.py capabilities \
            --manager-url https://ephemeral.fds-8.space \
            --audience https://ephemeral.fds-8.space/api/automation/v1 \
            --expected-job-workflow-ref "$EXPECTED_JOB_WORKFLOW_REF" \
            --expected-job-workflow-sha "$EXPECTED_JOB_WORKFLOW_SHA" \
            --environment "$PROTECTED_ENVIRONMENT" \
            --contract capability-contract/capability-contract.json \
            --zone "$APPROVED_ZONE" \
            --output capability-result
