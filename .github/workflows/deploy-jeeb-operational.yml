name: Deploy operational Jeeb ephemeral

on:
  workflow_call:
    inputs:
      shared_actions_sha:
        description: Exact full commit SHA of this reusable workflow.
        type: string
        required: true
      expected_job_workflow_ref:
        description: Exact reusable workflow identity approved by the manager.
        type: string
        required: true
      environment:
        type: string
        default: jeeb-ephemeral
      config_path:
        type: string
        default: deployments/jeeb-operational.json
      ttl_minutes:
        type: number
        default: 30
      zone:
        type: string
        default: fds-8.space
    secrets:
      stage_template_b64:
        required: true
      ghcr_token:
        required: true
      super_login_passcode:
        required: true
      openai_api_key:
        required: false
      coroot_api_key:
        required: true
    outputs:
      lease_id:
        value: ${{ jobs.deploy.outputs.lease_id }}
      https_url:
        value: ${{ jobs.deploy.outputs.https_url }}
      ssh_hostname:
        value: ${{ jobs.deploy.outputs.ssh_hostname }}
      vmid:
        value: ${{ jobs.deploy.outputs.vmid }}
      private_ip:
        value: ${{ jobs.deploy.outputs.private_ip }}
      expires_at:
        value: ${{ jobs.deploy.outputs.expires_at }}
      deployment_lock_sha256:
        value: ${{ jobs.deploy.outputs.deployment_lock_sha256 }}
      seed_user_count:
        value: ${{ jobs.deploy.outputs.seed_user_count }}
      seed_wallet_count:
        value: ${{ jobs.deploy.outputs.seed_wallet_count }}
      seed_admin_count:
        value: ${{ jobs.deploy.outputs.seed_admin_count }}

permissions: {}

jobs:
  deploy:
    name: Provision 24 Jeeb services and CMS
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      lease_id: ${{ steps.deploy.outputs.lease_id }}
      https_url: ${{ steps.deploy.outputs.https_url }}
      ssh_hostname: ${{ steps.deploy.outputs.ssh_hostname }}
      vmid: ${{ steps.deploy.outputs.vmid }}
      private_ip: ${{ steps.deploy.outputs.private_ip }}
      expires_at: ${{ steps.deploy.outputs.expires_at }}
      deployment_lock_sha256: ${{ steps.deploy.outputs.deployment_lock_sha256 }}
      seed_user_count: ${{ steps.deploy.outputs.seed_user_count }}
      seed_wallet_count: ${{ steps.deploy.outputs.seed_wallet_count }}
      seed_admin_count: ${{ steps.deploy.outputs.seed_admin_count }}
    steps:
      - name: Load trusted deployment tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: olivium-dev/shared-github-actions
          ref: ${{ inputs.shared_actions_sha }}
          path: trusted
          persist-credentials: false

      - name: Verify trusted commit
        env:
          EXPECTED_SHA: ${{ inputs.shared_actions_sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Load reviewed Jeeb configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: caller
          persist-credentials: false

      - name: Build the static container health probe
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools file
          make -C caller/runtime/tools CC=musl-gcc \
            OUT="$RUNNER_TEMP/olivium-runtime-tools" \
            "$RUNNER_TEMP/olivium-runtime-tools/http-health-probe"
          file "$RUNNER_TEMP/olivium-runtime-tools/http-health-probe" \
            | grep -Eq 'ELF.*statically linked'
          test "$(wc -c < "$RUNNER_TEMP/olivium-runtime-tools/http-health-probe")" -le 500000

      - name: Deploy, validate, and activate
        id: deploy
        env:
          JEEB_EPHEMERAL_STAGE_TEMPLATE_B64: ${{ secrets.stage_template_b64 }}
          JEEB_EPHEMERAL_GHCR_TOKEN: ${{ secrets.ghcr_token }}
          JEEB_EPHEMERAL_SUPER_LOGIN_PASSCODE: ${{ secrets.super_login_passcode }}
          JEEB_EPHEMERAL_OPENAI_API_KEY: ${{ secrets.openai_api_key }}
          JEEB_EPHEMERAL_COROOT_API_KEY: ${{ secrets.coroot_api_key }}
          MANAGER_URL: https://ephemeral.fds-8.space
          MANAGER_AUDIENCE: https://ephemeral.fds-8.space/api/automation/v1
          EXPECTED_JOB_WORKFLOW_REF: ${{ inputs.expected_job_workflow_ref }}
          EXPECTED_JOB_WORKFLOW_SHA: ${{ inputs.shared_actions_sha }}
          PROTECTED_ENVIRONMENT: ${{ inputs.environment }}
          CONFIG_PATH: ${{ inputs.config_path }}
          TTL_MINUTES: ${{ inputs.ttl_minutes }}
          ZONE: ${{ inputs.zone }}
        run: |
          set -euo pipefail
          case "$CONFIG_PATH" in
            deployments/*.json) ;;
            *) echo "::error::config_path must stay under deployments/"; exit 2 ;;
          esac
          python3 trusted/scripts/operational_orchestrate.py \
            --config "caller/$CONFIG_PATH" \
            --catalog caller/catalog/jeeb-full-v1.json \
            --postgres-schema caller/bootstrap/postgres-schema.sql.gz \
            --health-probe "$RUNNER_TEMP/olivium-runtime-tools/http-health-probe" \
            --guest-script trusted/scripts/operational_guest.py \
            --seed-helper trusted/scripts/operational_seed.py \
            --state lease-state.json \
            --ttl-minutes "$TTL_MINUTES" \
            --zone "$ZONE" \
            --manager-url "$MANAGER_URL" \
            --manager-audience "$MANAGER_AUDIENCE" \
            --expected-job-workflow-ref "$EXPECTED_JOB_WORKFLOW_REF" \
            --expected-job-workflow-sha "$EXPECTED_JOB_WORKFLOW_SHA" \
            --environment "$PROTECTED_ENVIRONMENT" \
            --cloudflared-version 2026.8.2 \
            --cloudflared-sha256 fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2 \
            --github-output

      - name: Publish real deployment links
        if: ${{ success() }}
        env:
          HTTPS_URL: ${{ steps.deploy.outputs.https_url }}
          SSH_HOSTNAME: ${{ steps.deploy.outputs.ssh_hostname }}
          LEASE_ID: ${{ steps.deploy.outputs.lease_id }}
          VMID: ${{ steps.deploy.outputs.vmid }}
          PRIVATE_IP: ${{ steps.deploy.outputs.private_ip }}
          EXPIRES_AT: ${{ steps.deploy.outputs.expires_at }}
          SEED_USERS: ${{ steps.deploy.outputs.seed_user_count }}
          SEED_REGULAR_USERS: ${{ steps.deploy.outputs.seed_regular_user_count }}
          SEED_JEEBERS: ${{ steps.deploy.outputs.seed_jeeber_count }}
          SEED_ADMINS: ${{ steps.deploy.outputs.seed_admin_count }}
          SEED_WALLETS: ${{ steps.deploy.outputs.seed_wallet_count }}
        run: |
          {
            echo '## Jeeb ephemeral deployment'
            echo
            echo '| Item | Value |'
            echo '|---|---|'
            echo "| Status | **24 Jeeb services and Jeeb CMS validated** |"
            echo "| Monitoring | **Lease-local Coroot eBPF agent validated** |"
            echo "| Jeeb CMS | [$HTTPS_URL]($HTTPS_URL) |"
            echo "| CMS login | [$HTTPS_URL/login]($HTTPS_URL/login) |"
            echo "| Health | [$HTTPS_URL/health/ready]($HTTPS_URL/health/ready) |"
            echo "| CMS health | [$HTTPS_URL/health]($HTTPS_URL/health) |"
            echo "| Seeded users | **$SEED_USERS** ($SEED_REGULAR_USERS regular, $SEED_JEEBERS Jeebers, $SEED_ADMINS admins) |"
            echo "| Seeded wallets | **$SEED_WALLETS** |"
            echo "| Seed roster | [$HTTPS_URL/gateway/api/User/super-login/users]($HTTPS_URL/gateway/api/User/super-login/users) |"
            echo "| Lease identity | [$HTTPS_URL/.well-known/olivium-lease]($HTTPS_URL/.well-known/olivium-lease) |"
            echo "| SSH hostname | \`$SSH_HOSTNAME\` |"
            echo "| SSH command | \`ssh -o ProxyCommand='cloudflared access ssh --hostname %h' ec2-user@$SSH_HOSTNAME\` |"
            echo "| Lease | \`$LEASE_ID\` |"
            echo "| VMID | \`$VMID\` |"
            echo "| Private IP | \`$PRIVATE_IP\` |"
            echo "| Expires | \`$EXPIRES_AT\` |"
            echo "| Delete now | [Delete this ephemeral environment](https://ephemeral.fds-8.space/?action=delete&lease=$LEASE_ID) |"
            echo "| Extend lifetime | [Add more usable time](https://ephemeral.fds-8.space/?action=extend&lease=$LEASE_ID) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Abort a failed pre-active lease
        if: ${{ always() && hashFiles('trusted/scripts/manager_client.py') != '' }}
        env:
          MANAGER_URL: https://ephemeral.fds-8.space
          MANAGER_AUDIENCE: https://ephemeral.fds-8.space/api/automation/v1
          EXPECTED_JOB_WORKFLOW_REF: ${{ inputs.expected_job_workflow_ref }}
          EXPECTED_JOB_WORKFLOW_SHA: ${{ inputs.shared_actions_sha }}
          PROTECTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/manager_client.py abort-if-needed \
            --manager-url "$MANAGER_URL" \
            --audience "$MANAGER_AUDIENCE" \
            --expected-job-workflow-ref "$EXPECTED_JOB_WORKFLOW_REF" \
            --expected-job-workflow-sha "$EXPECTED_JOB_WORKFLOW_SHA" \
            --environment "$PROTECTED_ENVIRONMENT" \
            --state lease-state.json
