name: Shared contract CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run shared workflow contract tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/actionlint.tar.gz"
          install_path="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$install_path"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive_path"
          echo "$ACTIONLINT_ARCHIVE_SHA256  $archive_path" | sha256sum --check --strict
          tar --extract --gzip --file "$archive_path" --directory "$install_path" actionlint
          "$install_path/actionlint" -version
          "$install_path/actionlint"
